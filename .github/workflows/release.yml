name: release

# A tag vX.Y.Z (made by scripts/release.sh) becomes a GitHub Release, with that
# version's section of CHANGELOG.md as the notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Notes from CHANGELOG.md
        run: |
          ver=${GITHUB_REF_NAME#v}
          [ "$(cat VERSION)" = "$ver" ] || { echo "VERSION is $(cat VERSION), tag is $ver"; exit 1; }
          awk -v v="$ver" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $ver"; exit 1; }
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "dropzone $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
