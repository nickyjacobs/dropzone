name: links

on:
  push:
    paths: ['**.md']
  pull_request:
    paths: ['**.md']
  schedule:
    # Weekly, to catch links that rot over time.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,206,429
            --exclude-path assets/
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
